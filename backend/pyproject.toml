[project]
name = "commerceops-api"
version = "0.1.0"
description = "CommerceOps AI - Ecommerce AI Operations Agent (backend API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "langchain==1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx2>=2.13",  # TestClient transport (starlette >=1.x)
    "ruff>=0.6",
]

[tool.uv]
# Not a distributable package: dependencies only, the app runs from source.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real PostgreSQL (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
# The local alembic/ migrations folder must not shadow the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use obviously fake credentials to prove they never leak.
"tests/**" = ["S105", "S106"]
